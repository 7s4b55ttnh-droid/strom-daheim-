name: Link-Wächter
# Prüft täglich alle Links zu fremden Seiten auf beiden Websites und schreibt werkzeuge/linkbericht.json.
# Die Tagesagenten lesen den Bericht und ersetzen tote Links. Zeit in UTC.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: linkcheck
  cancel-in-progress: false
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Links prüfen
        run: python3 werkzeuge/linkcheck.py
      - name: Bericht speichern
        run: |
          if [ -z "$(git status --porcelain werkzeuge/linkbericht.json)" ]; then echo "nichts neu"; exit 0; fi
          git config user.name "Link-Waechter"
          git config user.email "noreply@github.com"
          git add werkzeuge/linkbericht.json
          git commit -m "Link-Wächter: Bericht aktualisiert"
          for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep 20; done
